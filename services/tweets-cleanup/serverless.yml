service: tweets-cleanup

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    NEON_DATABASE_URL: ${env:NEON_DATABASE_URL, env:DATABASE_URL}

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3003
    lambdaPort: 3004

functions:
  dailyCleanup:
    handler: src/cleanup.dailyCleanup
    timeout: 120
    events:
      - schedule: rate(1 day)
    memorySize: 128


