service: jobs

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    OPENAI_API_KEY: ${env:OPENAI_API_KEY}
    GEMINI_KEY: ${env:GEMINI_KEY}
    NEON_DATABASE_URL: ${env:NEON_DATABASE_URL, env:DATABASE_URL}

plugins:
  - serverless-offline

build:
  esbuild:
    bundle: true
    sourcemap: true
    target: node20
    external:
      - pg-native

functions:
  periodicAnalytics:
    handler: src/periodic.runPeriodicAnalytics
    timeout: 900
    events:
      - schedule: rate(5 minutes) # every 5 minutes
      - schedule: cron(0 1 ? * MON *) # weekly on Monday 01:00 UTC
      - schedule: cron(0 2 1 * ? *)   # monthly on the 1st at 02:00 UTC
    memorySize: 256
    reservedConcurrency: 1


