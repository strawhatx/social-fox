[build]
  command = "npx prisma generate && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_DISABLE_SECRET_SCANNING = "true"
  NETLIFY_ALLOWED_ENV = "NEXT_AWS_REGION,NEXT_PUBLIC_CLERK_SIGN_IN_URL,NEXT_PUBLIC_CLERK_SIGN_UP_URL,NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"

[functions]
  # Ensure Prisma client and engines are bundled into Netlify Functions
  included_files = [
    "!*.env",
    "node_modules/.prisma/client/**",
    "node_modules/@prisma/client/**",
    "prisma/schema.prisma"
  ]

[[plugins]]
  package = "@netlify/plugin-nextjs"


