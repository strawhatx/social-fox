# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: syncfow
# "service" is the name of this project. This will also be added to your AWS resource names.
service: x-account-sync

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    CLERK_SECRET_KEY: ${env:CLERK_SECRET_KEY}
    NEON_DATABASE_URL: ${env:NEON_DATABASE_URL, env:DATABASE_URL}

  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "logs:CreateLogGroup"
            - "logs:CreateLogStream"
            - "logs:PutLogEvents"
          Resource: "arn:aws:logs:*:*:*"

plugins:
  - serverless-offline

package:
  patterns:
    - '!node_modules/**'
    - '!src/**'
    - '!tests/**'
    - '!.git/**'
    - '!.vscode/**'
    - '!*.md'
    - '!*.log'

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    external:
      - pg-native

functions:
  processJobs:
    handler: src/handler.processJobs
    timeout: 900 # 15 minutes
    events:
      - schedule: rate(1 minute)
    memorySize: 256