[build]
  command = "next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_DISABLE_SECRET_SCANNING = "true"
  NETLIFY_ALLOWED_ENV = "NEXT_AWS_REGION,NEXT_PUBLIC_CLERK_SIGN_IN_URL,NEXT_PUBLIC_CLERK_SIGN_UP_URL,NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"

[functions]
  included_files = ["!*.env"]

[[plugins]]
  package = "@netlify/plugin-nextjs"


