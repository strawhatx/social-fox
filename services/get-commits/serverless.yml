service: get-commits
frameworkVersion: '4'
plugins:
  - serverless-plugin-typescript

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1

functions:
  fetchTop5:
    handler: handler.main
    events:
      - schedule:
          rate: cron(0 12 ? * WED *) # Every Wednesday at noon UTC
          enabled: true
