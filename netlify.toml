[build]
  command = "next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"
  NEXT_TELEMETRY_DISABLED = "1"

[build.environment]
  NETLIFY_ALLOWED_ENV = "NEXT_PUBLIC_CLERK_SIGN_IN_URL,NEXT_PUBLIC_CLERK_SIGN_UP_URL,NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY,NEXT_AWS_REGION"

[[plugins]]
  package = "@netlify/plugin-nextjs"


