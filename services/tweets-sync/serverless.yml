service: tweets-sync

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    CLERK_SECRET_KEY: ${env:CLERK_SECRET_KEY}
    NEON_DATABASE_URL: ${env:NEON_DATABASE_URL, env:DATABASE_URL}

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3007
    lambdaPort: 3008

functions:
  processPosts:
    handler: src/handler.processPosts
    timeout: 900
    events:
      - schedule: rate(1 minute)
    memorySize: 256


