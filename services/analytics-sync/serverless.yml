service: jobs

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    CLERK_SECRET_KEY: ${env:CLERK_SECRET_KEY}
    NEON_DATABASE_URL: ${env:NEON_DATABASE_URL, env:DATABASE_URL}
    TWITTER_APP_ACCESS_TOKEN: ${env:TWITTER_APP_ACCESS_TOKEN}

plugins:
  - serverless-offline

build:
  esbuild:
    bundle: true
    sourcemap: true
    target: node20
    external:
      - pg-native

functions:
  dailyAnalytics:
    handler: src/router.dailyAnalytics
    timeout: 900
    events:
      - schedule: cron(0 0 * * ? *) # midnight UTC daily
    memorySize: 256
    reservedConcurrency: 1

  periodicAnalytics:
    handler: src/router.periodicAnalytics
    timeout: 900
    events:
      - schedule: cron(0 1 ? * MON *) # weekly on Monday 01:00 UTC
      - schedule: cron(0 2 1 * ? *)   # monthly on the 1st at 02:00 UTC
    memorySize: 256
    reservedConcurrency: 1


