[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    NODE_VERSION = "20"

# Client-side routing: send all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache built assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ensure HTML isn't cached so new deploys update immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Sitemap headers for SEO
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Robots.txt headers
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400" 